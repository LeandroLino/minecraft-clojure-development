ranks:
  info: "{prefix}<green>Seu rank: {rank}"
  info-next: "{prefix}<gray>Próximo: <white>{next}<gray> por <white>{price}<gray>. Use <white>/rank up<gray>."
  info-max: "{prefix}<gray>Você está no rank mais alto."
  list-header: "{prefix}<green>Ranks:"
  list-line: "<gray> - {rank} <dark_gray>({price})"
  list-line-current: "<gray> - {rank} <dark_gray>({price}) <green>◄ você"
  up-ok: "{prefix}<green>Você agora é {rank}<green>! Custo: <white>{price}<green>."
  up-max: "{prefix}<red>Você já está no rank mais alto."
  up-insufficient: "{prefix}<red>Você precisa de <white>{price}<red> para {next}<red> e tem <white>{balance}<red>."
  up-error: "{prefix}<red>Não foi possível comprar o rank agora. Tente de novo."
  set-ok: "{prefix}<green>Rank de <white>{player}<green> definido como {rank}<green>."
  set-notified: "{prefix}<green>Seu rank agora é {rank}<green>."
  unknown-rank: "{prefix}<red>Rank <white>{rank}<red> não existe. Ranks: <white>{ranks}"

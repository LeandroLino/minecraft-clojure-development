admin:
  status-header: "{prefix}<green>Status do servidor:"
  status-tps: "<gray> TPS (1m/5m/15m): <white>{tps}  <gray>Tick médio: <white>{mspt} ms"
  status-memory: "<gray> Memória: <white>{used} MB<gray> de <white>{max} MB"
  status-players: "<gray> Jogadores: <white>{online}<gray>/<white>{max}"
  status-uptime: "<gray> Ligado há: <white>{uptime}"
  status-world: "<gray> Mundo <white>{world}<gray>: <white>{players}<gray> jogadores, <white>{chunks}<gray> chunks, <white>{entities}<gray> entidades"
  status-backup: "<gray> Último backup: <white>{backup}"
  status-backup-none: "nenhum"

  backup-started: "{prefix}<green>Backup iniciado..."
  backup-done: "{prefix}<green>Backup concluído: <white>{file}<green> ({size}, {files} arquivos, {seconds}s)."
  backup-skipped-files: "{prefix}<yellow>{count} arquivo(s) não puderam ser lidos e ficaram de fora."
  backup-failed: "{prefix}<red>O backup falhou: <white>{reason}<red>. Veja o console."
  backup-running: "{prefix}<red>Já existe um backup em andamento."
  backup-disabled: "{prefix}<yellow>Os backups automáticos estão desligados no config (use <white>/sky backup now<yellow> para um manual)."
  backup-list-header: "{prefix}<green>Backups ({count}):"
  backup-list-line: "<gray> - <white>{file} <dark_gray>({size})"
  backup-list-none: "{prefix}<gray>Não há backups."
  backup-list-error: "{prefix}<red>Não foi possível listar os backups."

  broadcast: "<gold>[Aviso] <white>{message}"

  fly-on-self: "{prefix}<green>Voo ligado. Cuidado: ao desligar no ar você cai."
  fly-off-self: "{prefix}<green>Voo desligado."
  fly-on-other: "{prefix}<green>Voo de <white>{player}<green> ligado."
  fly-off-other: "{prefix}<green>Voo de <white>{player}<green> desligado."
  fly-notify-on: "{prefix}<green>Um admin ligou o seu voo."
  fly-notify-off: "{prefix}<green>Um admin desligou o seu voo."
  fly-gamemode: "{prefix}<yellow><white>{player}<yellow> já pode voar neste modo de jogo."

  vanish-on-self: "{prefix}<green>Você está invisível. Só quem tem <white>admin.vanish.see<green> vê você."
  vanish-off-self: "{prefix}<green>Você voltou a ser visível."
  vanish-on-other: "{prefix}<green><white>{player}<green> ficou invisível."
  vanish-off-other: "{prefix}<green><white>{player}<green> voltou a ser visível."

  mute-ok-timed: "{prefix}<green><white>{player}<green> foi silenciado por <white>{minutes}<green> min."
  mute-ok-permanent: "{prefix}<green><white>{player}<green> foi silenciado por tempo indeterminado."
  mute-notify-timed: "{prefix}<red>Você foi silenciado por {minutes} min."
  mute-notify-permanent: "{prefix}<red>Você foi silenciado por tempo indeterminado."
  unmute-ok: "{prefix}<green><white>{player}<green> pode falar de novo."
  unmute-not-muted: "{prefix}<yellow><white>{player}<yellow> não estava silenciado."
  unmute-notify: "{prefix}<green>Você pode falar de novo."
  muted-timed: "{prefix}<red>Você está silenciado por mais {minutes} min."
  muted-permanent: "{prefix}<red>Você está silenciado."

  heal-self: "{prefix}<green>Vida e fome restauradas."
  heal-other: "{prefix}<green><white>{player}<green> foi curado."
  heal-notify: "{prefix}<green>Um admin restaurou a sua vida e a sua fome."
  heal-dead: "{prefix}<yellow><white>{player}<yellow> está morto."

  senha-ok: "{prefix}<green>A senha de <white>{player}<green> foi trocada."
  senha-no-account: "{prefix}<yellow><white>{player}<yellow> não tem conta cadastrada (nunca usou o <white>/register<yellow>)."
  senha-too-short: "{prefix}<red>A senha é curta demais (veja <white>password.min-length<red> na configuração do módulo auth)."
  senha-too-long: "{prefix}<red>A senha é longa demais (veja <white>password.max-length<red> na configuração do módulo auth)."
  senha-no-auth: "{prefix}<red>O módulo de login (auth) não está ativo."

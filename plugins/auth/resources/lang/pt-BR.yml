auth:
  welcome-register: "{prefix}<yellow>Bem-vindo! Crie a sua conta com <white>{usage}<yellow> (senha de {min} a {max} caracteres). Você tem <white>{seconds}<yellow> segundos."
  welcome-login: "{prefix}<yellow>Bem-vindo de volta! Entre com <white>{usage}<yellow>. Você tem <white>{seconds}<yellow> segundos."
  welcome-unknown: "{prefix}<yellow>Entre com <white>/login<yellow> ou crie a sua conta com <white>/register<yellow>."
  remembered: "{prefix}<green>Bem-vindo de volta! Você voltou do mesmo endereço, então já está logado."
  reminder-register: "<yellow>Crie a sua conta: <white>{usage} <gray>({seconds}s)"
  reminder-login: "<yellow>Entre na sua conta: <white>{usage} <gray>({seconds}s)"
  blocked: "<red>Entre na sua conta primeiro: <white>{usage}"
  registered-ok: "{prefix}<green>Conta criada! Você já está logado. Guarde a sua senha: ela não pode ser recuperada, só trocada por um administrador."
  login-ok: "{prefix}<green>Login feito. Bom jogo!"
  already-registered: "{prefix}<red>Você já tem uma conta. Use <white>/login<red>."
  already-logged-in: "{prefix}<yellow>Você já está logado."
  not-registered: "{prefix}<red>Você ainda não tem uma conta. Use <white>{usage}<red>."
  password-mismatch: "{prefix}<red>As duas senhas não são iguais."
  password-too-short: "{prefix}<red>A senha precisa ter pelo menos <white>{min}<red> caracteres."
  password-too-long: "{prefix}<red>A senha pode ter no máximo <white>{max}<red> caracteres."
  wrong-password: "{prefix}<red>Senha errada. Tentativas restantes: <white>{left}<red>."
  too-many-attempts: "<red>Senha errada demais. Tente de novo ao entrar."
  timeout: "<red>Tempo esgotado: você não entrou na sua conta a tempo."
  name-taken: "{prefix}<red>Já existe uma conta com esse nome (maiúsculas e minúsculas contam como o mesmo nome)."
  loading: "{prefix}<yellow>Carregando os seus dados. Tente de novo em instantes."
  error: "{prefix}<red>Não foi possível agora. Tente de novo."
